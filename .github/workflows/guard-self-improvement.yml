name: Immortal Guard Independent Engine QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/ai_reviews.json'
      - '.github/workflows/guard-self-improvement.yml'
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
permissions:
  contents: read
concurrency:
  group: immortal-guard-independent-engine-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Compile and run local engine contracts
        run: |
          python -m compileall -q scripts
          python scripts/guard_final_contract.py
          python scripts/guard_engineering_benchmark.py
          python scripts/guard_health.py
          python scripts/official_source_gate.py
          python scripts/verification_gate.py
          python scripts/test_official_source_gate.py
          python scripts/test_specialist_swarm.py
