name: Immortal Guard Opportunity Radar
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-radar
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run safe radar
        run: python3 scripts/collect_opportunities.py
      - name: Run independent specialist engine
        run: python3 scripts/opportunity_engine.py
      - name: Run Airdrop Plus specialist
        run: python3 scripts/airdrop_plus.py
      - name: Build guarded collection queue
        run: python3 scripts/collection_router.py
      - name: Run optional live AI council
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASTRA_MODEL: gpt-5.4
          CLAUDE_MODEL: claude-sonnet-4-6
        run: python3 scripts/ai_council.py
      - name: Validate data
        run: python3 -c "import json; [json.load(open(p)) for p in ['data/opportunities.json','data/history.json','data/engine_reviews.json','data/airdrop_plus.json','data/owner_actions.json','data/collection_queue.json','data/temp_wallet.json','data/ai_reviews.json']]; print('JSON OK')"
      - name: Commit refreshed radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json data/history.json data/engine_reviews.json data/airdrop_plus.json data/owner_actions.json data/collection_queue.json data/temp_wallet.json data/ai_reviews.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: refresh immortal guard radar'; git push; fi
