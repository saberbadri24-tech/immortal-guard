name: Immortal Guard Opportunity Radar
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-radar
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run safe radar
        run: python3 scripts/collect_opportunities.py
      - name: Run live AI council
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASTRA_MODEL: gpt-5.6-luna
          CLAUDE_MODEL: claude-sonnet-5
          GEMINI_MODEL: gemini-3.6-flash
        run: python3 scripts/ai_council.py
      - name: Validate data
        run: python3 -c "import json; json.load(open('data/opportunities.json')); json.load(open('data/history.json')); print('JSON OK')"
      - name: Commit refreshed radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json data/history.json data/ai_reviews.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: refresh immortal guard radar'; git push; fi
