# Fresh push-triggered run verifies the full radar after workflow recovery.
name: Immortal Guard Opportunity Radar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opportunity-radar.yml'
      - 'scripts/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-radar-v5
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Keep ANIL X Render regions warm
        continue-on-error: true
        run: |
          for url in "https://anil-x-live.onrender.com/api/health" "https://anil-x-global.onrender.com/api/health"; do
            if curl --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
              echo "ANIL X health reachable: $url"
            else
              echo "ANIL X health check did not pass: $url"
            fi
          done
      - name: Load public ANIL X main TON destination
        continue-on-error: true
        run: |
          address="$(curl --fail --silent --show-error --max-time 20 "https://anil-x-live.onrender.com/api/payment-config" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("ton",{}).get("address") or "")')"
          if [[ "$address" =~ ^(EQ|UQ)[A-Za-z0-9_-]{46}$ ]]; then
            echo "MAIN_TON_ADDRESS=$address" >> "$GITHUB_ENV"
            echo "Main TON destination loaded for transfer verification."
          else
            echo "Main TON destination unavailable; transfer verification remains fail-closed."
          fi
      - name: Compile-check Guard scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run multisensor token discovery radar
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; sleep $((n*5)); done; }
          retry python3 scripts/multisensor_radar.py
      - name: Run safe radar
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; sleep $((n*5)); done; }
          retry python3 scripts/collect_opportunities.py
      - name: Run live verification gate
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; sleep $((n*5)); done; }
          retry python3 scripts/verification_gate.py
      - name: Run direct official-source qualification gate
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; sleep $((n*5)); done; }
          retry python3 scripts/official_source_gate.py
      - name: Run deterministic specialist swarm and offline contracts
        run: |
          python3 scripts/specialist_swarm.py
          python3 scripts/test_specialist_swarm.py
          python3 scripts/test_official_source_gate.py
      - name: Run independent specialist engine
        run: python3 scripts/opportunity_engine.py
      - name: Build evidence lineage graph
        run: python3 scripts/evidence_graph.py
      - name: Run Airdrop Plus specialist
        run: python3 scripts/airdrop_plus.py
      - name: Run Value Hunter — high-income prioritization
        run: python3 scripts/value_hunter.py
      - name: Build unified Opportunity Intelligence layer
        run: python3 scripts/opportunity_intelligence.py
      - name: Build evidence-backed income pipeline
        run: python3 scripts/income_pipeline.py
      - name: Build durable revenue ledger
        run: python3 scripts/revenue_ledger.py
      - name: Build Revenue Magnet
        run: python3 scripts/revenue_magnet.py
      - name: Build guarded collection queue
        run: python3 scripts/collection_router.py
      - name: Build claim adapter registry
        run: python3 scripts/claim_adapter_registry.py
      - name: Load owner-configured temporary TON address
        env:
          TEMP_TON_ADDRESS: ${{ vars.TEMP_TON_ADDRESS }}
          TON_CONNECT_ADDRESS: ${{ vars.TON_CONNECT_ADDRESS }}
        run: |
          address="$(python3 - <<'PY'
          import json, os, re
          pattern = r'(?:EQ|UQ)[A-Za-z0-9_-]{46}|-?[01]:[0-9a-fA-F]{64}'
          candidates = [os.getenv('TEMP_TON_ADDRESS', ''), os.getenv('TON_CONNECT_ADDRESS', '')]
          try:
              cfg = json.load(open('data/temp_wallet.json', encoding='utf-8'))
              if cfg.get('configured') is True:
                  candidates.append(str(cfg.get('address') or ''))
          except Exception:
              pass
          address = next((x.strip() for x in candidates if re.fullmatch(pattern, x.strip())), '')
          print(address)
          PY
          )"
          if [ -n "$address" ]; then
            echo "TEMP_TON_ADDRESS=$address" >> "$GITHUB_ENV"
            echo "Temporary TON receiving address loaded from owner configuration."
          else
            echo "Temporary TON address not configured; receipt monitor will remain fail-closed."
          fi
      - name: Monitor temporary TON wallet receipts
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: python3 scripts/ton_receipt_monitor.py
      - name: Run optional live AI council
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASTRA_MODEL: gpt-5.6-luna
          CLAUDE_MODEL: claude-sonnet-4-6
        run: |
          timeout 75s python3 scripts/ai_council.py || echo 'External AI review timed out/failed; deterministic local specialist swarm remains active.'
      - name: Build Guard health snapshot
        run: python3 scripts/guard_health.py
      - name: Build evidence-gated learning state
        run: python3 scripts/guard_learning.py
      - name: Run engineering ceiling benchmark
        run: python3 scripts/guard_engineering_benchmark.py
      - name: Validate HTML and JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for (const file of ['index.html','admin.html']) {
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(m=>!(/application\/ld\+json/i.test(m[1]||'')))
              .map(m=>m[2]).filter(Boolean);
            for (const [i,src] of scripts.entries()) vm.createScript(src,{filename:file+':script-'+i});
            console.log('JS OK',file);
          }
          NODE
          node --check live-monitor.js
      - name: Validate data
        run: python3 -c "import json; files=['data/radar_intel.json','data/radar_memory.json','data/verification_gate.json','data/official_source_gate.json','data/radar_alerts.json','data/opportunities.json','data/history.json','data/engine_reviews.json','data/evidence_graph.json','data/airdrop_plus.json','data/opportunity_intelligence.json','data/income_pipeline.json','data/owner_actions.json','data/collection_queue.json','data/temp_wallet.json','data/claim_adapters.json','data/ton_receipts.json','data/ton_receipt_state.json','data/ai_reviews.json','data/daily_hunt.json','data/owner_approval_ledger.json','data/revenue_ledger.json','data/revenue_targets.json','data/guard_status.json','data/learning_state.json','data/engineering_benchmark.json','data/specialist_swarm.json','data/provider_circuit_state.json']; [((print('VALID',p)),json.load(open(p))) for p in files]; print('JSON OK')"
      - name: Commit refreshed radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar_intel.json data/radar_memory.json data/verification_gate.json data/official_source_gate.json data/radar_alerts.json data/opportunities.json data/history.json data/engine_reviews.json data/evidence_graph.json data/airdrop_plus.json data/value_hunt.json data/opportunity_intelligence.json data/income_pipeline.json data/owner_actions.json data/collection_queue.json data/temp_wallet.json data/claim_adapters.json data/ton_receipts.json data/ton_receipt_state.json data/transfer_state.json data/ai_reviews.json data/daily_hunt.json data/owner_approval_ledger.json data/revenue_ledger.json data/revenue_targets.json data/guard_status.json data/learning_state.json data/engineering_benchmark.json data/specialist_swarm.json data/provider_circuit_state.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'chore: refresh immortal guard radar'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 5))
            done
            echo 'Push failed after 3 retries' >&2
            exit 1
          fi
