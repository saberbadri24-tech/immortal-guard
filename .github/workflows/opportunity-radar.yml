name: Immortal Guard Opportunity Radar
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-radar
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check Guard scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run multisensor token discovery radar
        run: python3 scripts/multisensor_radar.py
      - name: Run safe radar
        run: python3 scripts/collect_opportunities.py
      - name: Run independent specialist engine
        run: python3 scripts/opportunity_engine.py
      - name: Build evidence lineage graph
        run: python3 scripts/evidence_graph.py
      - name: Run Airdrop Plus specialist
        run: python3 scripts/airdrop_plus.py
      - name: Run Value Hunter — high-income prioritization
        run: python3 scripts/value_hunter.py
      - name: Build guarded collection queue
        run: python3 scripts/collection_router.py
      - name: Build claim adapter registry
        run: python3 scripts/claim_adapter_registry.py
      - name: Monitor temporary TON wallet receipts
        env:
          TEMP_TON_ADDRESS: ${{ vars.TEMP_TON_ADDRESS }}
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: python3 scripts/ton_receipt_monitor.py
      - name: Run optional live AI council
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASTRA_MODEL: gpt-5.4
          CLAUDE_MODEL: claude-sonnet-4-6
        run: python3 scripts/ai_council.py
      - name: Build Guard health snapshot
        run: python3 scripts/guard_health.py
      - name: Validate data
        run: python3 -c "import json; files=['data/radar_intel.json','data/radar_memory.json','data/radar_alerts.json','data/opportunities.json','data/history.json','data/engine_reviews.json','data/evidence_graph.json','data/airdrop_plus.json','data/owner_actions.json','data/collection_queue.json','data/temp_wallet.json','data/claim_adapters.json','data/ton_receipts.json','data/ton_receipt_state.json','data/ai_reviews.json','data/daily_hunt.json','data/owner_approval_ledger.json','data/guard_status.json']; [((print('VALID',p)),json.load(open(p))) for p in files]; print('JSON OK')"
      - name: Commit refreshed radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar_intel.json data/radar_memory.json data/radar_alerts.json data/opportunities.json data/history.json data/engine_reviews.json data/evidence_graph.json data/airdrop_plus.json data/value_hunt.json data/owner_actions.json data/collection_queue.json data/temp_wallet.json data/claim_adapters.json data/ton_receipts.json data/ton_receipt_state.json data/ai_reviews.json data/daily_hunt.json data/owner_approval_ledger.json data/guard_status.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: refresh immortal guard radar'; git push; fi
